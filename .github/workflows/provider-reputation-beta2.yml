name: Provider reputation beta.2

on:
  push:
    branches: [feature/provider-reputation]
    paths:
      - '.github/workflows/provider-reputation-beta2.yml'

permissions:
  contents: write
  packages: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-reputation

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Wire provider metrics dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'ui/src/types/index.ts',
              "export type OverlayType = 'indexManager' | 'streaming' | 'nzbDatabase' | 'cache' | 'stats' | 'userAgent' | 'filters' | 'healthChecks' | 'ultimateFallback' | 'proxy' | 'logs' | 'autoPlay' | 'streamDisplay' | 'zyclops' | null;",
              "export type OverlayType = 'indexManager' | 'streaming' | 'nzbDatabase' | 'cache' | 'stats' | 'providerStats' | 'userAgent' | 'filters' | 'healthChecks' | 'ultimateFallback' | 'proxy' | 'logs' | 'autoPlay' | 'streamDisplay' | 'zyclops' | null;",
          )

          replace_once(
              'ui/src/constants/index.ts',
              "export const DEFAULT_CARD_ORDER = ['streaming', 'indexManager', 'proxy', 'zyclops', 'ultimateFallback', 'healthChecks', 'nzbDatabase', 'autoPlay', 'streamDisplay', 'cache', 'filters', 'userAgent', 'status', 'stats', 'power'];",
              "export const DEFAULT_CARD_ORDER = ['streaming', 'indexManager', 'proxy', 'zyclops', 'ultimateFallback', 'healthChecks', 'providerStats', 'nzbDatabase', 'autoPlay', 'streamDisplay', 'cache', 'filters', 'userAgent', 'status', 'stats', 'power'];",
          )

          replace_once(
              'ui/src/hooks/useAppConfig.ts',
              "      setCardOrder(order);\n\n      // Load auto-play settings",
              "      if (!order.includes('providerStats')) {\n        const healthIdx = order.indexOf('healthChecks');\n        order = healthIdx !== -1\n          ? [...order.slice(0, healthIdx + 1), 'providerStats', ...order.slice(healthIdx + 1)]\n          : [...order, 'providerStats'];\n      }\n      setCardOrder(order);\n\n      // Load auto-play settings",
          )

          provider_card = '''                providerStats: (
                  <div
                    key="providerStats"
                    draggable
                    onDragStart={() => handleCardDragStart('providerStats')}
                    onDragOver={(e) => handleCardDragOver(e, 'providerStats')}
                    onDrop={(e) => handleCardDrop(e, 'providerStats')}
                    onDragEnd={handleCardDragEnd}
                    className={clsx(
                      "card p-4 cursor-move group hover:!border-emerald-400/50 hover:!shadow-emerald-400/30 active:!border-emerald-400/50 active:!shadow-emerald-400/30 transition-all",
                      isDragging && "opacity-50 scale-95",
                      isOver && "ring-2 ring-emerald-400 scale-105"
                    )}
                    onClick={() => {
                      if (!draggedCard) setActiveOverlay('providerStats');
                    }}
                  >
                    <div className="flex items-center gap-3 mb-2">
                      <GripVertical className="w-4 h-4 text-slate-600" />
                      <div className="w-7 h-7 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center group-hover:scale-110 group-active:scale-110 transition-transform">
                        <Shield className="w-4 h-4 text-emerald-400" />
                      </div>
                      <span className="text-slate-400 text-sm">Provider Performance</span>
                    </div>
                    <div className="text-3xl font-bold group-hover:text-emerald-400 group-active:text-emerald-400 transition-colors">
                      {healthChecks.providers.filter(p => p.enabled).length} Providers
                    </div>
                    <div className="text-xs text-slate-500 mt-1 group-hover:text-slate-400 group-active:text-slate-400 transition-colors">Article-check analytics &rarr;</div>
                  </div>
                ),
'''
          replace_once(
              'ui/src/components/DashboardTab.tsx',
              '                stats: (\n',
              provider_card + '                stats: (\n',
          )

          replace_once(
              'ui/src/App.tsx',
              "import { StatsOverlay } from './components/overlays/StatsOverlay';\n",
              "import { StatsOverlay } from './components/overlays/StatsOverlay';\nimport { ProviderStatsOverlay } from './components/overlays/ProviderStatsOverlay';\n",
          )

          provider_overlay = '''      {/* Provider Performance Overlay */}
      {ac.activeOverlay === 'providerStats' && (
        <ProviderStatsOverlay
          onClose={() => ac.setActiveOverlay(null)}
          apiFetch={apiFetch}
        />
      )}

'''
          replace_once(
              'ui/src/App.tsx',
              '      {/* Stats Overlay */}\n',
              provider_overlay + '      {/* Stats Overlay */}\n',
          )
          PY

      - name: Set beta.2 version
        run: |
          npm version 1.9.0-beta.2 --no-git-tag-version
          (cd ui && npm version 1.9.0-beta.2 --no-git-tag-version)

      - name: Backend install, test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        run: |
          cd ui
          npm ci
          npm run build

      - name: Commit tested beta source and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/provider-reputation-beta2.yml
          git add package.json package-lock.json ui/package.json ui/package-lock.json ui/src src test
          git commit -m 'feat: add provider performance dashboard beta.2'
          git push origin HEAD:feature/provider-reputation

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 beta.2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=1.9.0-beta.2
          tags: |
            ghcr.io/sawdoctor/usenet-ultimate:v1.9.0-beta.2
