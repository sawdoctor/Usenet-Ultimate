name: v1.9.0 release prep

on:
  push:
    branches:
      - feature/provider-reputation
    paths:
      - '.github/workflows/release-prep-v1.9.yml'

permissions:
  contents: write
  packages: write

jobs:
  release-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-reputation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare stable source
        run: |
          python3 .github/release-prep-v1.9.py
          npm version 1.9.0 --no-git-tag-version
          (cd ui && npm version 1.9.0 --no-git-tag-version)

      - name: Backend install, test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        run: |
          cd ui
          npm ci
          npm run build

      - name: Commit tested stable source and remove temporary release files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/release-prep-v1.9.py .github/workflows/release-prep-v1.9.yml
          git add README.md package.json package-lock.json ui/package.json ui/package-lock.json
          git commit -m 'release: prepare v1.9.0'
          git push origin HEAD:feature/provider-reputation

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch release candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/sawdoctor/usenet-ultimate:v1.9.0-rc
