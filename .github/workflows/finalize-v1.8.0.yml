name: Finalize v1.8.0 release candidate

on:
  push:
    branches:
      - release-v1.8.0

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v1.8.0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set stable version
        run: |
          npm version 1.8.0 --no-git-tag-version
          cd ui
          npm version 1.8.0 --no-git-tag-version

      - name: Backend install, tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Commit tested stable source and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/finalize-v1.8.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ui/package.json ui/package-lock.json .github/workflows/finalize-v1.8.0.yml
          git commit -m "release: prepare v1.8.0"
          git push origin HEAD:release-v1.8.0
