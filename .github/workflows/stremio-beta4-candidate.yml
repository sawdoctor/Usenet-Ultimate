name: Stremio beta.4 candidate

on:
  push:
    branches:
      - fix/stremio-progressive-webdav

permissions:
  contents: write
  packages: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-progressive-webdav
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set beta.4 version
        shell: bash
        run: |
          npm version 1.8.0-beta.4 --no-git-tag-version
          cd ui
          npm version 1.8.0-beta.4 --no-git-tag-version

      - name: Backend install, tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push beta.4 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/sawdoctor/usenet-ultimate:v1.8.0-beta.4

      - name: Commit tested beta.4 version and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/stremio-beta4-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ui/package.json ui/package-lock.json .github/workflows/stremio-beta4-candidate.yml
          git commit -m "chore: mark progressive Stremio beta.4 candidate"
          git push origin HEAD:fix/stremio-progressive-webdav
