name: Stremio beta.8 candidate

on:
  push:
    branches:
      - fix/stremio-progressive-webdav

permissions:
  contents: write
  packages: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-progressive-webdav
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prefer episode-sized Stremio fallbacks and shorten exposure window
        shell: bash
        run: |
          cat > src/nzbdav/candidateOrder.ts <<'EOF'
          import type { FallbackCandidate } from './types.js';

          /**
           * Keep the result the user clicked first, then prefer candidates that
           * can satisfy a single-episode request without unpacking a remote season
           * pack. Library-backed packs stay in the preferred tier because their
           * video path is already exposed and costs no NZBDav submission delay.
           */
          export function orderEpisodeStreamingCandidates(
            candidates: FallbackCandidate[],
            clickedIdx: number,
            contentType?: string,
            episode?: string,
          ): FallbackCandidate[] {
            if (clickedIdx < 0 || clickedIdx >= candidates.length) return [...candidates];

            const clicked = candidates[clickedIdx];
            const rest = [
              ...candidates.slice(clickedIdx + 1),
              ...candidates.slice(0, clickedIdx),
            ];

            if (contentType !== 'series' || episode === undefined || episode === '') {
              return [clicked, ...rest];
            }

            const preferred: FallbackCandidate[] = [];
            const remotePacks: FallbackCandidate[] = [];
            for (const candidate of rest) {
              if (candidate.isSeasonPack && !candidate.libraryVideoPath) remotePacks.push(candidate);
              else preferred.push(candidate);
            }

            return [clicked, ...preferred, ...remotePacks];
          }
          EOF

          cat > test/candidateOrder.test.ts <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { orderEpisodeStreamingCandidates } from '../src/nzbdav/candidateOrder.js';
          import type { FallbackCandidate } from '../src/nzbdav/types.js';

          const c = (title: string, isSeasonPack = false, libraryVideoPath?: string): FallbackCandidate => ({
            nzbUrl: `https://example.invalid/${title}.nzb`,
            title,
            indexerName: 'test',
            isSeasonPack,
            ...(libraryVideoPath ? { libraryVideoPath } : {}),
          });

          test('episode fallback keeps clicked result first then prefers singles before remote packs', () => {
            const input = [
              c('clicked-pack', true),
              c('other-pack', true),
              c('single-a'),
              c('library-pack', true, '/content/tv/library-pack/E05.mkv'),
              c('single-b'),
            ];
            const ordered = orderEpisodeStreamingCandidates(input, 0, 'series', '5');
            assert.deepEqual(ordered.map(x => x.title), [
              'clicked-pack', 'single-a', 'library-pack', 'single-b', 'other-pack',
            ]);
          });

          test('clicked single remains first while later remote packs move behind other singles', () => {
            const input = [c('pack-before', true), c('clicked-single'), c('pack-after', true), c('single-after')];
            const ordered = orderEpisodeStreamingCandidates(input, 1, 'series', '5');
            assert.deepEqual(ordered.map(x => x.title), [
              'clicked-single', 'single-after', 'pack-before', 'pack-after',
            ]);
          });

          test('movies retain the existing clicked-then-wrap order', () => {
            const input = [c('a', true), c('b'), c('c', true)];
            const ordered = orderEpisodeStreamingCandidates(input, 1, 'movie');
            assert.deepEqual(ordered.map(x => x.title), ['b', 'c', 'a']);
          });

          test('series requests without an episode retain the existing order', () => {
            const input = [c('a', true), c('b'), c('c', true)];
            const ordered = orderEpisodeStreamingCandidates(input, 1, 'series');
            assert.deepEqual(ordered.map(x => x.title), ['b', 'c', 'a']);
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/nzbdav/streamHandler.ts')
          s = p.read_text()

          import_anchor = "import type { NZBDavConfig, StreamData, FallbackCandidate } from './types.js';"
          if s.count(import_anchor) != 1:
              raise SystemExit(f'candidate-order import anchor count={s.count(import_anchor)}')
          s = s.replace(import_anchor, import_anchor + "\nimport { orderEpisodeStreamingCandidates } from './candidateOrder.js';", 1)

          old = """      if (clickedIdx >= 0) {
            candidates.push(...group.candidates.slice(clickedIdx));
            candidates.push(...group.candidates.slice(0, clickedIdx));
          } else {"""
          new = """      if (clickedIdx >= 0) {
            candidates.push(...orderEpisodeStreamingCandidates(
              group.candidates, clickedIdx, group.type, group.episode
            ));
          } else {"""
          if s.count(old) != 1:
              raise SystemExit(f'clicked candidate ordering anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old_error = "No playable WebDAV file exposed within 20s: ${title}"
          if s.count(old_error) != 1:
              raise SystemExit(f'20s error anchor count={s.count(old_error)}')
          s = s.replace(old_error, "No playable WebDAV file exposed within 8s: ${title}", 1)
          p.write_text(s)

          p = Path('src/nzbdav/videoDiscovery.ts')
          s = p.read_text()
          old_timeout = "  timeoutMs = 20_000,"
          if s.count(old_timeout) != 1:
              raise SystemExit(f'early WebDAV timeout anchor count={s.count(old_timeout)}')
          s = s.replace(old_timeout, "  timeoutMs = 8_000,", 1)
          p.write_text(s)
          PY

          grep -q "orderEpisodeStreamingCandidates" src/nzbdav/streamHandler.ts
          grep -q "timeoutMs = 8_000" src/nzbdav/videoDiscovery.ts
          grep -q "within 8s" src/nzbdav/streamHandler.ts

      - name: Set beta.8 version
        shell: bash
        run: |
          npm version 1.8.0-beta.8 --no-git-tag-version
          cd ui
          npm version 1.8.0-beta.8 --no-git-tag-version

      - name: Backend install, tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push beta.8 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/sawdoctor/usenet-ultimate:v1.8.0-beta.8
            ghcr.io/sawdoctor/usenet-ultimate:beta

      - name: Commit tested beta.8 and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/stremio-beta8-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nzbdav/candidateOrder.ts src/nzbdav/streamHandler.ts src/nzbdav/videoDiscovery.ts test/candidateOrder.test.ts package.json package-lock.json ui/package.json ui/package-lock.json .github/workflows/stremio-beta8-candidate.yml
          git commit -m "fix: prioritize episode streaming candidates"
          git push origin HEAD:fix/stremio-progressive-webdav
