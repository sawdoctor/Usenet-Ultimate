name: v1.8 dependency audit inspection (temporary)

on:
  push:
    branches:
      - v1.8.0-beta

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.0-beta

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Backend install
        run: npm ci

      - name: Backend audit JSON
        shell: bash
        run: |
          echo '===== BACKEND AUDIT START ====='
          npm audit --json || true
          echo '===== BACKEND AUDIT END ====='

      - name: UI install
        working-directory: ui
        run: npm ci

      - name: UI audit JSON
        working-directory: ui
        shell: bash
        run: |
          echo '===== UI AUDIT START ====='
          npm audit --json || true
          echo '===== UI AUDIT END ====='
