name: Release v1.8.0

on:
  push:
    branches:
      - fix/stremio-progressive-webdav

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-progressive-webdav
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare stable source and release notes
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin refs/tags/v1.8.0 >/dev/null 2>&1; then
            echo 'v1.8.0 tag already exists; refusing to republish'
            exit 1
          fi

          # The running workflow is already loaded by Actions; remove it from the
          # release tree immediately so neither master nor the Docker context keeps it.
          rm -f .github/workflows/release-v1.8.0.yml

          npm version 1.8.0 --no-git-tag-version
          (cd ui && npm version 1.8.0 --no-git-tag-version)

          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          s = readme.read_text()
          marker = '## What\'s New in v1.7.10'
          if s.count(marker) != 1:
              raise SystemExit(f'README insertion marker count={s.count(marker)}')

          section = '''## What's New in v1.8.0

Version 1.8.0 hardens the Newznab/Arr path, makes NNTP verification safer by
default, removes the vulnerable Stremio SDK routing dependency, and repairs
progressive Stremio playback through InfiniDysk/NZBDav.

### Newznab / Arr security

- Newznab NZB references are signed and scoped before `t=get` can resolve them.
- Tampered, cross-manifest and legacy arbitrary target references are rejected.
- Existing selected-grab caching/coalescing remains in place to avoid duplicate
  indexer downloads and retry storms.

### NNTP verification

- TLS certificate verification is enabled by default for NNTP providers.
- Providers that genuinely require a self-signed certificate have an explicit
  advanced override rather than silently disabling verification globally.
- Protocol classification is stricter: `223` is found, `430` is missing, while
  authentication errors, temporary errors, disconnects and timeouts remain
  unknown/unverified instead of being falsely cached as missing.
- Fake NNTP/TLS regression tests cover the important reply and certificate paths.

### Stremio playback

- `stremio-addon-sdk` has been removed; the stream resource now uses native
  Express routes with the existing manifest-key isolation and CORS handling.
- InfiniDysk/NZBDav streams can start as soon as a playable WebDAV file is
  exposed, without waiting for the SAB-style queue job to report completion.
- A candidate that does not become progressively streamable within 8 seconds is
  cancelled in NZBDav, temporarily suppressed, and the next candidate can be
  tried without leaving abandoned jobs behind.
- For episode playback, the result the user clicked remains first; after that,
  single-episode candidates and already-exposed library packs are preferred over
  remote season packs.
- Normal user-picked streams stay on the inline proxy even when Ultimate
  Fallback is enabled; the dedicated fallback lobby retains its recovery path.

### Security and maintenance

- Safe dependency updates were applied and the critical Stremio SDK dependency
  was eliminated.
- Repository metadata, issue templates and Docker source labels were cleaned up.

### Validation before release

The Newznab/Arr path was exercised with real Seerr/Sonarr/Radarr workflows,
including an 89-episode acquisition, repeated-search/cache testing, real provider
article checks, and a downstream missing-articles failure that was learned and
replaced successfully. NNTP `430 Missing Article` handling is covered by the fake
NNTP regression suite rather than claimed as a live provider observation.

Stremio beta testing verified progressive WebDAV exposure, cancellation of slow
candidates, fallback to later candidates without queue buildup, and inline
Dual-Stage Proxy delivery with Ultimate Fallback enabled. Player compatibility
still depends on the Android/player/media combination; one HEVC/Atmos MKV that
was delivered correctly by UU required VLC instead of Stremio's internal player.

---

'''
          readme.write_text(s.replace(marker, section + marker, 1))

          # Comment/import cleanup only when the old symbols occur nowhere except
          # the import line. This cannot remove a live code dependency.
          p = Path('src/nzbdav/streamHandler.ts')
          s = p.read_text()
          if s.count('waitForJobCompletion') == 1:
              s = s.replace(
                  "import { submitNzb, waitForJobCompletion, cancelJob } from './nzbdavApi.js';",
                  "import { submitNzb, cancelJob } from './nzbdavApi.js';",
                  1,
              )
          if s.count('waitForVideoFile') == 1:
              s = s.replace(
                  "import { waitForVideoFile, waitForEarlyVideoFile, checkNzbLibrary, videoPathExists } from './videoDiscovery.js';",
                  "import { waitForEarlyVideoFile, checkNzbLibrary, videoPathExists } from './videoDiscovery.js';",
                  1,
              )
          s = s.replace(
              ''' * Complete stream preparation pipeline:\n * 0. Check NZB library for existing video (skip grab if found)\n * 1. Submit NZB to NZBDav\n * 2. Poll history for completion/failure\n * 3. Find video file in WebDAV\n''',
              ''' * Progressive Stremio preparation pipeline:\n * 0. Reuse an existing WebDAV/library video when available\n * 1. Submit the selected NZB to NZBDav\n * 2. Briefly poll for early WebDAV exposure\n * 3. Cancel and reject transiently if the file is not exposed in time\n * 4. Probe the exposed file before delivery\n''',
              1,
          )
          s = s.replace(
              '''  // Step 2: Stremio fast path — InfiniDysk/NZBDav may expose a virtual WebDAV\n  // file while the SAB-compatible queue still says "downloading". Give that\n  // path a short chance first. If it is not available, preserve the existing\n  // completion semantics unchanged.\n''',
              '''  // Step 2: Stremio progressive path — InfiniDysk/NZBDav may expose a virtual\n  // WebDAV file while the SAB-compatible queue still says "downloading". Give\n  // that path a short bounded chance; a miss is cancelled and treated as a\n  // transient streaming-only rejection so another candidate can be tried.\n''',
              1,
          )
          p.write_text(s)

          p = Path('src/nzbdav/videoDiscovery.ts')
          s = p.read_text()
          s = s.replace(
              ''' * This is deliberately bounded. If no virtual file appears quickly, the caller\n * falls back to the existing queue/history completion path unchanged.\n''',
              ''' * This is deliberately bounded. If no virtual file appears quickly, the caller\n * cancels that streaming attempt and can advance to another candidate.\n''',
              1,
          )
          p.write_text(s)
          PY

          cat > /tmp/release-notes.md <<'EOF'
          # Usenet Ultimate v1.8.0

          v1.8.0 is a security, reliability and Stremio-streaming release built on the selected-grab work from v1.7.10.

          ## Newznab / Arr hardening

          - Newznab NZB references are now signed and scoped before `t=get` resolves them.
          - Tampered, cross-manifest and legacy arbitrary target references are rejected.
          - Selected-grab caching/coalescing continues to prevent duplicate upstream NZB downloads and retry storms.
          - Real Seerr/Sonarr/Radarr testing included an 89-episode acquisition, repeated-search/cache checks, healthy selected grabs and downstream failure/replacement learning.

          ## NNTP security and classification

          - NNTP TLS certificates are verified by default.
          - A provider-specific advanced override is available for genuinely self-signed endpoints.
          - `223` is classified as found and `430` as missing; authentication errors, temporary errors, disconnects and timeouts remain unknown/unverified instead of becoming false missing results.
          - Fake NNTP/TLS tests cover these protocol and certificate paths. A live provider-side `430` was not required for release and is not being claimed.

          ## Stremio

          - Removed the vulnerable `stremio-addon-sdk` router and replaced it with native Express stream routes.
          - InfiniDysk/NZBDav playback can begin from early WebDAV exposure instead of waiting for queue completion.
          - Progressive candidates get an 8-second exposure window. Slow candidates are cancelled, temporarily suppressed and the next candidate can be tried without leaving queue buildup.
          - The clicked episode result stays first; later single-episode results and already-exposed library packs are preferred before remote season packs.
          - Normal user-picked playback stays on the inline proxy even when Ultimate Fallback is enabled; the dedicated fallback lobby keeps its recovery path.
          - Real beta testing reached `Stream ready` and inline Dual-Stage Proxy delivery in seconds with Ultimate Fallback enabled.

          ## Security / maintenance

          - Safe dependency updates applied.
          - Critical Stremio SDK dependency removed.
          - Repository metadata, Docker source labels and issue templates cleaned up.

          ## Player note

          UU can deliver a valid stream that a particular Android/Stremio internal player does not decode. During beta testing one HEVC/Atmos MKV played immediately in VLC after UU delivered it correctly. This is documented as a player/media compatibility edge case rather than a backend streaming failure.

          ---
          **Full Changelog**: https://github.com/sawdoctor/Usenet-Ultimate/compare/v1.7.10...v1.8.0
          EOF

          echo 'Prepared stable 1.8.0 source and release notes.'

      - name: Backend install, tests and build
        shell: bash
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        working-directory: ui
        shell: bash
        run: |
          npm ci
          npm run build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stable multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=1.8.0
          tags: |
            ghcr.io/sawdoctor/usenet-ultimate:v1.8.0
            ghcr.io/sawdoctor/usenet-ultimate:latest

      - name: Publish stable source, tag and GitHub release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "release: v1.8.0"

          # Both refs are descendants of master, so these are fast-forward pushes.
          git push origin HEAD:fix/stremio-progressive-webdav
          git push origin HEAD:master

          git tag -a v1.8.0 -m "Release v1.8.0"
          git push origin v1.8.0

          gh release create v1.8.0 \
            --repo sawdoctor/Usenet-Ultimate \
            --title "v1.8.0 — Newznab hardening and progressive Stremio streaming" \
            --notes-file /tmp/release-notes.md
