name: Stremio beta.7 candidate

on:
  push:
    branches:
      - fix/stremio-progressive-webdav

permissions:
  contents: write
  packages: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-progressive-webdav
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Keep normal Stremio deliveries inline with UF enabled
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/nzbdav/streamHandler.ts')
          s = p.read_text()

          # Ultimate Library: change only the first lobby-gated proxy branch.
          old = "} else if (proxyFn && !lobbyFallbackOn) {"
          if s.count(old) != 2:
              raise SystemExit(f'expected two lobby-gated proxy branches, found {s.count(old)}')
          s = s.replace(old, "} else if (proxyFn) {", 1)

          # Cached user-pick delivery no longer needs the current UF toggle.
          old = "        const fallbackOn = globalConfig.ultimateFallback?.enabled === true;\n        const sizeSuffix = cached.streamData.videoSize ? ` (${formatBytes(cached.streamData.videoSize)})` : '';"
          new = "        const sizeSuffix = cached.streamData.videoSize ? ` (${formatBytes(cached.streamData.videoSize)})` : '';"
          if s.count(old) != 1:
              raise SystemExit(f'dedup fallback anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = "} else if (!fallbackOn && proxyFn) {"
          if s.count(old) != 1:
              raise SystemExit(f'dedup inline anchor count={s.count(old)}')
          s = s.replace(old, "} else if (proxyFn) {", 1)

          # First successful normal user-pick: inline transport regardless of UF.
          old = "const inline = !fallbackOn && proxyFn;"
          if s.count(old) != 1:
              raise SystemExit(f'primary inline anchor count={s.count(old)}')
          s = s.replace(old, "const inline = !!proxyFn;", 1)

          # Update the now-stale explanatory comment, without touching UF lobby code.
          old = "      // When fallback is off, the initial-delivery mode still forces proxy for\n      // logging/dedup consistency; /v's proxyVideoStream independently reads\n      // config on each range request, so seeks honor the user's current method."
          new = "      // Normal user-picked streams stay on the inline proxy even when Ultimate\n      // Fallback is enabled. UF chooses candidates; only the actual UF lobby and\n      // vetted-backup flow need the /v redirect and its _fb recovery URL."
          if s.count(old) != 1:
              raise SystemExit(f'delivery comment anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          # Guard the two actual UF transport branches: one inline boolean in the
          # lobby and one lobby-gated else-if in the vetted-backup path.
          if s.count("const inline = proxyFn && !lobbyFallbackOn;") != 1:
              raise SystemExit('UF lobby inline gate changed unexpectedly')
          if s.count("} else if (proxyFn && !lobbyFallbackOn) {") != 1:
              raise SystemExit('UF backup inline gate changed unexpectedly')

          p.write_text(s)
          PY

          grep -q 'const inline = !!proxyFn;' src/nzbdav/streamHandler.ts
          grep -q 'const inline = proxyFn && !lobbyFallbackOn;' src/nzbdav/streamHandler.ts

      - name: Set beta.7 version
        shell: bash
        run: |
          npm version 1.8.0-beta.7 --no-git-tag-version
          cd ui
          npm version 1.8.0-beta.7 --no-git-tag-version

      - name: Backend install, tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push beta.7 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/sawdoctor/usenet-ultimate:v1.8.0-beta.7
            ghcr.io/sawdoctor/usenet-ultimate:beta

      - name: Commit tested beta.7 version and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/stremio-beta7-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nzbdav/streamHandler.ts package.json package-lock.json ui/package.json ui/package-lock.json .github/workflows/stremio-beta7-candidate.yml
          git commit -m "fix: keep normal Stremio streams inline with fallback enabled"
          git push origin HEAD:fix/stremio-progressive-webdav
