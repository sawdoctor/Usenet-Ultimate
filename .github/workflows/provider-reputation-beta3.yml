name: Provider reputation beta.3

on:
  push:
    branches: [feature/provider-reputation]
    paths:
      - '.github/workflows/provider-reputation-beta3.yml'

permissions:
  contents: write
  packages: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-reputation

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply rolling history patch
        run: python3 scripts/apply-provider-history-beta3.py

      - name: Set beta.3 version
        run: |
          npm version 1.9.0-beta.3 --no-git-tag-version
          (cd ui && npm version 1.9.0-beta.3 --no-git-tag-version)

      - name: Backend install, test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        run: |
          cd ui
          npm ci
          npm run build

      - name: Commit tested beta source and remove temporary build files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/provider-reputation-beta3.yml scripts/apply-provider-history-beta3.py
          git add package.json package-lock.json ui/package.json ui/package-lock.json ui/src src test
          git commit -m 'feat: add rolling provider history beta.3'
          git push origin HEAD:feature/provider-reputation

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 beta.3 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=1.9.0-beta.3
          tags: |
            ghcr.io/sawdoctor/usenet-ultimate:v1.9.0-beta.3
