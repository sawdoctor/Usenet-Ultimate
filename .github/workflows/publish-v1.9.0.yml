name: Publish v1.9.0

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-v1.9.0.yml'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify release version
        run: |
          test "$(node -p "require('./package.json').version")" = "1.9.0"
          test "$(node -p "require('./ui/package.json').version")" = "1.9.0"

      - name: Backend install, test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        run: |
          cd ui
          npm ci
          npm run build

      - name: Remove temporary publish workflow from master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v1.9.0.yml
          git commit -m 'chore: remove temporary v1.9 publisher'
          git push origin HEAD:master

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stable multi-arch images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sawdoctor/usenet-ultimate:v1.9.0
            ghcr.io/sawdoctor/usenet-ultimate:latest

      - name: Tag clean release commit
        run: |
          git tag -a v1.9.0 -m 'Usenet Ultimate v1.9.0'
          git push origin v1.9.0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/v1.9.0-notes.md <<'EOF'
          ## Provider performance analytics

          v1.9.0 adds local, observe-only NNTP provider analytics built from the article checks Usenet Ultimate already performs.

          ### Highlights
          - Provider Performance dashboard with mobile-friendly analytics
          - Per-provider `223` found / explicit `430` missing / unknown outcomes
          - Coverage, answer rate, provider-check success and average latency
          - Auth, TLS, timeout, connection and other failure buckets
          - Backup-provider rescue tracking
          - Pool/backup role filtering and expandable raw counters
          - Lifetime totals plus genuine 24h / 7d / 30d rolling history
          - Compact hourly history retained for 31 days
          - Local persistence in `config/provider-reputation.json`
          - Retired provider history retained after configuration removal

          ### Safety boundary
          Provider analytics are observational only. v1.9.0 does not add NNTP probes, reorder providers, change pool/backup priority, disable providers, alter health verdicts, or introduce a composite provider score.

          ### Validation
          Tested with live Sonarr, Radarr and Radarr4K acquisition traffic. Real-world samples produced both `223` found and explicit `430` missing outcomes while normal acquisitions continued successfully. Rolling history was verified independently from pre-v1.9 lifetime totals.

          Final release validation passed backend tests/build, the full UI build, and multi-architecture Docker builds for **amd64 and arm64**.
          EOF
          gh release create v1.9.0 \
            --title 'v1.9.0 — Provider Performance Analytics' \
            --notes-file /tmp/v1.9.0-notes.md \
            --verify-tag
