name: Apply v1.7.10 README update

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/update-readme-v1.7.10-v2.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Update README
        env:
          SECTION_B64: 
        run: |
          python -c 'import base64,os; from pathlib import Path; p=Path("README.md"); t=p.read_text(); m="---\n\n## What\x27s New in v1.7.8"; s=base64.b64decode(os.environ["SECTION_B64"]).decode(); assert "## What\x27s New in v1.7.10" not in t; assert m in t; p.write_text(t.replace(m,s+m,1))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: add v1.7.10 release notes to README"
          git push origin master
