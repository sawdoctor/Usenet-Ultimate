name: Stremio progressive WebDAV experiment

on:
  push:
    branches:
      - fix/stremio-progressive-webdav

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-progressive-webdav
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply progressive WebDAV experiment
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Commit experiment and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/stremio-progressive-webdav-experiment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nzbdav/videoDiscovery.ts src/nzbdav/streamHandler.ts .github/workflows/stremio-progressive-webdav-experiment.yml
          git commit -m "fix: try WebDAV before Stremio queue completion"
          git push origin HEAD:fix/stremio-progressive-webdav
