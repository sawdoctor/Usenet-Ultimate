name: v1.8 final backend audit fix (temporary)

on:
  push:
    branches:
      - v1.8.0-beta

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.0-beta
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply compatible backend audit fix
        run: npm audit fix || true

      - name: Backend tests
        run: npm test

      - name: Backend build
        run: npm run build

      - name: UI install and build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Final backend audit
        run: npm audit || true

      - name: Commit tested dependency update
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
          else
            git commit -m "chore: resolve remaining backend dependency advisories"
            git push origin HEAD:v1.8.0-beta
          fi
