name: v1.8.0 release prep

on:
  push:
    branches:
      - fix/stremio-progressive-webdav

permissions:
  contents: write
  packages: write

jobs:
  release-prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-progressive-webdav
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Final source cleanup and release notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/nzbdav/streamHandler.ts')
          s = p.read_text()
          s = s.replace("import { submitNzb, waitForJobCompletion, cancelJob } from './nzbdavApi.js';", "import { submitNzb, cancelJob } from './nzbdavApi.js';")
          s = s.replace("import { waitForVideoFile, waitForEarlyVideoFile, checkNzbLibrary, videoPathExists } from './videoDiscovery.js';", "import { waitForEarlyVideoFile, checkNzbLibrary, videoPathExists } from './videoDiscovery.js';")
          s = s.replace(" * Main stream preparation pipeline with 302 redirect to WebDAV proxy.\n * Handles NZB submission -> job polling -> video discovery -> redirect,\n * with automatic fallback on failure and self-redirect to reset Stremio's timer.", " * Main Stremio stream preparation and delivery pipeline.\n * Uses progressive WebDAV exposure, bounded candidate fallback, and inline\n * proxy delivery while preserving Ultimate Fallback recovery semantics.")
          s = s.replace(" * 2. Poll history for completion/failure\n * 3. Find video file in WebDAV", " * 2. Briefly poll WebDAV for progressive exposure\n * 3. Cancel and advance when a candidate is not quickly streamable")
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          marker = "## What's New in v1.7.10\n"
          if marker not in s:
              raise SystemExit('README v1.7.10 marker not found')
          lines = [
              "## What's New in v1.8.0",
              "",
              "Version 1.8.0 hardens the Newznab/Arr path and repairs Stremio streaming around",
              "InfiniDysk/NzbDAV progressive WebDAV exposure.",
              "",
              "### Newznab and security hardening",
              "",
              "- Newznab `t=get` references are signed and manifest-scoped instead of accepting",
              "  arbitrary legacy target URLs.",
              "- NNTP TLS certificates are verified by default; self-signed providers require",
              "  the explicit per-provider override.",
              "- NNTP health classification is strict: `223` confirms an article, `430` is a",
              "  conclusive missing article, while authentication errors, timeouts,",
              "  disconnects and unexpected replies remain unverified rather than being",
              "  misclassified as missing.",
              "- Candidate NZBs are not prefetched during search. Selected-grab payloads are",
              "  fetched once, reused for inspection/health checks, and concurrent retries are",
              "  coalesced.",
              "",
              "### Stremio streaming repair",
              "",
              "- Replaced the vulnerable `stremio-addon-sdk` router with native Express routes.",
              "- Stremio now starts from progressive WebDAV exposure instead of waiting for the",
              "  NzbDAV queue entry to report full completion.",
              "- A candidate that does not expose a playable WebDAV file within 8 seconds is",
              "  cancelled in NzbDAV, temporarily suppressed, and the next candidate is tried.",
              "- For episode requests, the clicked result remains first; subsequent",
              "  single-episode releases and already-library-backed packs are preferred before",
              "  remote season packs.",
              "- Normal user-picked streams stay on the inline proxy even when Ultimate",
              "  Fallback is enabled, while the actual Ultimate Fallback recovery path retains",
              "  its fallback redirect semantics.",
              "",
              "### Validation",
              "",
              "The Arr/Newznab path was exercised with live Seerr/Sonarr/Radarr workflows,",
              "including a large multi-episode acquisition, repeat-search/cache behaviour,",
              "authenticated provider checks, and real downstream `missing_articles` recovery.",
              "The Stremio path was tested against InfiniDysk with progressive WebDAV exposure,",
              "job cancellation, candidate fall-through, Ultimate Fallback enabled, and inline",
              "proxy playback. Some Android Stremio media combinations may still require an",
              "external player such as VLC; that is a player/media compatibility limitation,",
              "not a failed NzbDAV delivery.",
              "",
              "---",
              "",
          ]
          section = "\n".join(lines) + "\n"
          s = s.replace(marker, section + marker, 1)
          p.write_text(s)
          PY

          npm version 1.8.0 --no-git-tag-version
          (cd ui && npm version 1.8.0 --no-git-tag-version)

          grep -q '"version": "1.8.0"' package.json
          grep -q "What's New in v1.8.0" README.md
          ! grep -q 'waitForJobCompletion' src/nzbdav/streamHandler.ts
          ! grep -q 'waitForVideoFile' src/nzbdav/streamHandler.ts

      - name: Backend install, tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch release candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/sawdoctor/usenet-ultimate:v1.8.0-rc

      - name: Commit release-ready source and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/v1.8.0-release-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/nzbdav/streamHandler.ts package.json package-lock.json ui/package.json ui/package-lock.json .github/workflows/v1.8.0-release-prep.yml
          git commit -m "release: prepare v1.8.0"
          git push origin HEAD:fix/stremio-progressive-webdav
