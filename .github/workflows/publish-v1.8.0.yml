name: Publish v1.8.0

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-v1.8.0.yml

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Remove temporary workflow and pin clean release commit
        shell: bash
        run: |
          rm -f .github/workflows/publish-v1.8.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-v1.8.0.yml
          git commit -m "chore: remove v1.8.0 publish workflow"
          git push origin HEAD:master
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify release source
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "1.8.0"
          test "$(node -p "require('./ui/package.json').version")" = "1.8.0"
          grep -q "What's New in v1.8.0" README.md
          test ! -e .github/workflows/publish-v1.8.0.yml

      - name: Backend install, tests and build
        run: |
          npm ci
          npm test
          npm run build

      - name: UI install and build
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push stable multi-arch images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/sawdoctor/usenet-ultimate:v1.8.0
            ghcr.io/sawdoctor/usenet-ultimate:latest

      - name: Tag release commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git tag -a v1.8.0 -m "Release v1.8.0"
          git push origin v1.8.0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## Usenet Ultimate v1.8.0

          v1.8.0 hardens the Newznab/Arr path and repairs Stremio streaming around InfiniDysk/NzbDAV progressive WebDAV exposure.

          ### Newznab / Arr hardening
          - Newznab `t=get` references are signed and manifest-scoped.
          - NNTP TLS certificates are verified by default, with an explicit per-provider self-signed override.
          - Article classification is strict: `223` confirms presence, `430` is explicit missing evidence, while auth errors, transient replies, disconnects and timeouts remain unverified.
          - Search results are returned without speculative candidate-NZB prefetching.
          - The selected NZB payload is fetched once and reused for inspection and optional NNTP verification.
          - Concurrent selected-grab retries and health checks are coalesced to reduce repeated indexer traffic.

          ### Stremio streaming repair
          - Replaced the vulnerable `stremio-addon-sdk` router with native Express routes.
          - Streaming can begin as soon as InfiniDysk/NzbDAV exposes a playable WebDAV file instead of waiting for full queue completion.
          - Progressive exposure is bounded to 8 seconds per candidate.
          - Slow candidates are cancelled in NzbDAV, temporarily suppressed, and the next candidate is tried without leaving abandoned jobs behind.
          - For episode requests, the clicked release remains first; subsequent single-episode and already-library-backed candidates are preferred before remote season packs.
          - Normal user-picked playback stays on the inline proxy even with Ultimate Fallback enabled; the actual Ultimate Fallback recovery path keeps its fallback behaviour.

          ### Validation
          - 27/27 backend regression tests passed before release.
          - Backend and UI production builds passed.
          - Stable Docker images are built for both `linux/amd64` and `linux/arm64`.
          - Live Arr testing covered Seerr/Sonarr/Radarr workflows, a large multi-episode acquisition, repeated-search/cache behaviour, authenticated provider checks, and real downstream `missing_articles` recovery with replacement.
          - Live Stremio testing covered progressive WebDAV exposure, candidate cancellation/fall-through, Ultimate Fallback enabled, inline proxy delivery, and clean InfiniDysk queue behaviour.

          ### Known limitation
          Some Android Stremio media/player combinations may still require an external player such as VLC even after UU has successfully delivered a valid stream. This is not treated as a failed NzbDAV delivery.

          Direct live UU `430` handling was not encountered during production testing; explicit `430` classification is covered by the fake-NNTP regression tests.
          EOF
          gh release create v1.8.0 --title "v1.8.0" --notes-file /tmp/release-notes.md --verify-tag
