name: Publish v1.8.0

on:
  push:
    branches:
      - fix/stremio-progressive-webdav

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-progressive-webdav
          fetch-depth: 0

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.8.0"
          git fetch origin master --tags
          git merge-base --is-ancestor origin/master HEAD
          if git ls-remote --exit-code --tags origin refs/tags/v1.8.0 >/dev/null 2>&1; then
            echo 'v1.8.0 already exists; refusing to republish'
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tested multi-arch RC
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect ghcr.io/sawdoctor/usenet-ultimate:v1.8.0-rc

      - name: Publish clean source to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-v1.8.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/publish-v1.8.0.yml
          git commit -m "release: v1.8.0"
          git push origin HEAD:fix/stremio-progressive-webdav
          git push origin HEAD:master

      - name: Promote tested RC to stable tags
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/sawdoctor/usenet-ultimate:v1.8.0 \
            --tag ghcr.io/sawdoctor/usenet-ultimate:latest \
            ghcr.io/sawdoctor/usenet-ultimate:v1.8.0-rc
          docker buildx imagetools inspect ghcr.io/sawdoctor/usenet-ultimate:v1.8.0

      - name: Tag and create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v1.8.0 -m "Release v1.8.0"
          git push origin v1.8.0

          cat > /tmp/release-notes.md <<'EOF'
          # Usenet Ultimate v1.8.0

          v1.8.0 hardens the Newznab/Arr path, tightens NNTP security and repairs progressive Stremio streaming through InfiniDysk/NZBDav.

          ## Newznab / Arr hardening

          - Newznab `t=get` references are signed and manifest-scoped instead of accepting arbitrary legacy target URLs.
          - Selected-grab payload caching/coalescing remains in place to prevent duplicate indexer downloads and retry storms.
          - Real Seerr/Sonarr/Radarr validation included repeat-search/cache testing, authenticated provider checks, a large multi-episode acquisition and downstream `missing_articles` recovery.

          ## NNTP security

          - TLS certificate verification is enabled by default for NNTP providers.
          - Self-signed endpoints require an explicit provider override.
          - `223` is treated as found and `430` as conclusively missing; authentication errors, temporary replies, disconnects and timeouts remain unknown/unverified.
          - Fake NNTP/TLS regression tests cover the important protocol and certificate paths. A live provider-side `430` is not being claimed.

          ## Stremio

          - Removed the vulnerable `stremio-addon-sdk` router and replaced it with native Express stream routes.
          - Playback can start from progressive WebDAV exposure instead of waiting for the NZBDav queue entry to report completion.
          - Candidates that do not expose a playable WebDAV file within 8 seconds are cancelled, temporarily suppressed and skipped without leaving abandoned jobs behind.
          - For episode requests, the clicked result stays first; later single-episode results and already-exposed library packs are preferred before remote season packs.
          - Normal user-picked streams stay on the inline proxy even when Ultimate Fallback is enabled; the dedicated fallback path retains its recovery semantics.

          ## Player note

          Android/player/media compatibility still varies. During beta testing one HEVC/Atmos MKV was delivered correctly by UU but required VLC instead of Stremio's internal player. That is documented as a player/media edge case rather than a failed NZBDav delivery.

          ---
          **Full Changelog**: https://github.com/sawdoctor/Usenet-Ultimate/compare/v1.7.10...v1.8.0
          EOF

          gh release create v1.8.0 \
            --repo sawdoctor/Usenet-Ultimate \
            --title "v1.8.0 — Newznab hardening and progressive Stremio streaming" \
            --notes-file /tmp/release-notes.md
