name: v1.8 SSRF patch (temporary)

on:
  push:
    branches:
      - v1.8.0-beta

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.0-beta
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply signed Newznab reference patch
        run: python3 scripts/apply_v18_ssrf.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/auth/auth.ts src/routes/newznab.ts test/newznabReference.test.ts
          git diff --cached --check
          git commit -m "security: sign Newznab NZB references"
          git push origin HEAD:v1.8.0-beta
