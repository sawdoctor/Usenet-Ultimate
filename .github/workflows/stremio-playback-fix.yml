name: Stremio playback fix validation

on:
  push:
    branches:
      - fix/stremio-playback-keepalive

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-playback-keepalive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply narrow Stremio playback fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/stremio_fix.py
          python3 /tmp/stremio_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Test backend
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/stremio-playback-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nzbdav/streamCache.ts src/nzbdav/streamHandler.ts src/nzbdav/stremioWait.ts test/stremioPlaybackGuard.test.ts .github/workflows/stremio-playback-fix.yml
          git commit -m "fix: keep Stremio playback preparation single-flight [skip ci]"
          git push origin HEAD:fix/stremio-playback-keepalive
