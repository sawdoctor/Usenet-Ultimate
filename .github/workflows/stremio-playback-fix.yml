name: Stremio playback fix validation

on:
  push:
    branches:
      - fix/stremio-playback-keepalive

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stremio-playback-keepalive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply minimal playback fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache = Path('src/nzbdav/streamCache.ts')
          text = cache.read_text()
          start = text.index('  // Set as pending with a TTL')
          end = text.index('\n\n  promise.then', start)
          replacement = '''  // Keep the pending entry authoritative until the preparation itself settles.
          // Stremio reconnects while slow NZBDav jobs are still running; expiring this
          // entry on an unrelated Ultimate-Fallback timeout can make a reconnect submit
          // the same NZB again while the original job is still alive. Promise settlement
          // below is the cleanup boundary, so reconnects always join the same work.
          pendingCache.set(cacheKey, {
            status: 'pending',
            promise,
            expiresAt: Infinity,
          });'''
          cache.write_text(text[:start] + replacement + text[end:])

          handler = Path('src/nzbdav/streamHandler.ts')
          text = handler.read_text()
          old = 'if (attemptBudgetMs > stremioRemainingMs && stremioRemainingMs > 0 && !req.socket.destroyed) {'
          new = 'if (stremioRemainingMs > 0 && !req.socket.destroyed) {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one initial Stremio wait gate, found {text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace(
              '// On the initial request, race against the remaining Stremio window when\n        // the attempt budget would exceed it. If the stream isn\'t ready in time,\n        // self-redirect so the post-redirect ExoPlayer race takes over.',
              '// On the initial request, always bound the client-facing wait to Stremio\'s\n        // remaining HTTP window. The underlying getOrCreateStream promise stays alive\n        // in the pending cache, so the self-redirect rejoins the same NZBDav job.'
          )
          handler.write_text(text)

          Path('test/stremioPlaybackGuard.test.ts').write_text('''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          test('pending stream preparation stays single-flight until it settles', () => {
            const source = readFileSync(new URL('../src/nzbdav/streamCache.ts', import.meta.url), 'utf8');
            assert.match(source, /pendingCache\.set\(cacheKey,[\s\S]*?expiresAt: Infinity/);
            assert.doesNotMatch(source, /expiresAt: Date\.now\(\) \+ pendingTTLMs/);
          });

          test('initial Stremio request always uses the existing client timeout redirect gate', () => {
            const source = readFileSync(new URL('../src/nzbdav/streamHandler.ts', import.meta.url), 'utf8');
            assert.match(source, /if \(stremioRemainingMs > 0 && !req\.socket\.destroyed\) \{/);
            assert.doesNotMatch(source, /attemptBudgetMs > stremioRemainingMs/);
            assert.match(source, /Stremio timeout redirect/);
            assert.match(source, /isExoTimeout: true/);
          });
          ''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Test backend
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/stremio-playback-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nzbdav/streamCache.ts src/nzbdav/streamHandler.ts test/stremioPlaybackGuard.test.ts .github/workflows/stremio-playback-fix.yml
          git commit -m "fix: keep Stremio playback preparation single-flight [skip ci]"
          git push origin HEAD:fix/stremio-playback-keepalive
