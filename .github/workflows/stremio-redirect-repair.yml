name: Stremio redirect repair (temporary)

on:
  push:
    paths:
      - '.github/workflows/stremio-redirect-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.8.0-beta
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply repair
        run: python3 scripts/apply-stremio-redirect-repair.py

      - name: Install dependencies
        run: timeout 5m npm ci

      - name: Run tests
        run: timeout 5m npm test

      - name: Build
        run: timeout 5m npm run build

      - name: Commit repair and clean temporary files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/apply-stremio-redirect-repair.py .github/workflows/stremio-redirect-repair.yml
          git add src/addon/healthCheckCoordinator.ts src/nzbdav/streamHandler.ts
          git diff --cached --check
          git commit -m "fix: bound Stremio redirect chains"
          git push origin HEAD:v1.8.0-beta
